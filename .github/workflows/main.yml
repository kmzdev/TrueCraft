name: Build TrueCraft

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Install .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish launcher
        run: dotnet publish TrueCraft.Launcher/TrueCraft.Launcher.csproj --configuration Release --runtime win-x64 --self-contained false --output publish

      - name: Upload compiled files
        uses: actions/upload-artifact@v4
        with:
          name: TrueCraft-Windows-x64
          path: publish/
          if-no-files-found: error
